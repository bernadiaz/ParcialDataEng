# Pipeline NYC Taxi — perfiles de ambiente
#
# DEV (local / 8 GB RAM):
#   make up ENV=dev
#   make all ENV=dev MES=2025-03
#
# PROD (S3 AWS + Snowflake; sin MinIO):
#   make all ENV=prod MES=2025-03
#
# Límites de memoria para notebooks ~8 GB.
# Airbyte OSS completo NO se levanta aquí (varios GB); ver airbyte/README_AIRBYTE.md.

name: nyc-taxi

services:
  # --- DEV: S3 compatible local ---
  minio:
    profiles: ["dev"]
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5

  minio-init:
    profiles: ["dev"]
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-nyc-taxi};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nyc-taxi}
    mem_limit: 128m
    restart: "no"

  # Worker del pipeline (dev y prod). En prod no se usa MinIO.
  pipeline:
    profiles: ["dev", "prod"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ..:/app
      - pipeline-data:/app/data
    env_file:
      - path: ../.env
        required: false
    environment:
      ENV: ${ENV:-dev}
      MES: ${MES:-2025-03}
      DATA_DIR: /app/data
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2.0
    # Extra hosts: desde el contenedor, "minio" resuelve en la red compose (solo perfil dev).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Monitoreo (perfil aparte: ~800 MB). make up-monitoring ---
  pushgateway:
    profiles: ["monitoring"]
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    depends_on:
      - pushgateway
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    mem_limit: 400m
    mem_reservation: 200m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    restart: unless-stopped

volumes:
  minio-data:
  pipeline-data:
  prometheus-data:
  grafana-data:
