# Observability + BI stack for the NYC Taxi pipeline (make up / make down).
#   Grafana     http://localhost:3002   pipeline health, data quality, logs (Prometheus + Loki)
#   Prometheus  http://localhost:9090   scrapes the Pushgateway
#   Pushgateway http://localhost:9091   receives the metrics of every pipeline step
#   Loki        http://localhost:3100   log store (Grafana Alloy ships pipeline + container logs)
#   Dozzle      http://localhost:8081   live container logs
#   Superset    http://localhost:8090   business dashboards on the Snowflake marts (English)
#   Dagster     http://localhost:3003   orchestration UI (make dagster-ui runs it on the host)
# Secrets come from .env. Images are pinned to exact versions. Ports bind to 127.0.0.1 only and avoid
# the ports of other local stacks (3000/3001/8088/8089 are often taken).
name: nyc-taxi

services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:3100:3100"]
    volumes: [loki-data:/loki]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DATA_DIR:-./data}/logs:/var/log/nyc-taxi:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["127.0.0.1:12345:12345"]
    depends_on: [loki]
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.1
    # The Pushgateway keeps metrics in memory. The persistence file (saved every 30 s and on shutdown)
    # keeps the last pushed values across container restarts and reboots, so Grafana is not empty
    # until the next pipeline run.
    command: [--persistence.file=/pushgateway/metrics.db, --persistence.interval=30s]
    volumes: [pushgateway-data:/pushgateway]
    ports: ["127.0.0.1:9091:9091"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=30d]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [pushgateway]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline_health.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3002:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v8.13.0
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  superset:
    build: ./superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in .env}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
    volumes:
      # Superset metadata (dashboards, charts, datasets, connections) in a host folder: it survives
      # container restarts, `docker compose down -v`, volume prunes, Docker resets and reboots.
      - ${DATA_DIR:-./data}/superset_home:/app/superset_home
      # Offline BI copy of the DuckDB warehouse (WAREHOUSE=duckdb), read only
      - ${DATA_DIR:-./data}/bi:/app/data/bi:ro
      # Snowflake key pair of the service user (SNOWFLAKE_PRIVATE_KEY_PATH lives here on the host)
      - ${SNOWFLAKE_KEYS_DIR:-./data/keys}:/app/keys:ro
    ports: ["127.0.0.1:8090:8088"]
    restart: unless-stopped

volumes:
  loki-data:
  pushgateway-data:
  prometheus-data:
  grafana-data:
