# Interpretaciones de las preguntas de negocio: enero 2025 (mes asignado) vs enero 2024.
# src/resultados.py copia cada texto debajo de su resultado en RESULTADOS.md y en la sección de
# resultados del README (make questions). q1..q5: un párrafo. q6: hasta 5 líneas, una por renglón.
# conclusiones: cierre general, una línea por renglón.
# Redactadas con Claude Code a pedido del autor, a partir de los resultados medidos en los marts de
# Snowflake (run 20261115T013031Z-c9565f) y de consultas de control sobre marts.fact_trips. Los
# números están en formato español (punto = miles, coma = decimales). El autor las revisa y las
# defiende en el oral.

q1: >-
  Nueve de las diez zonas con más pickups están en Manhattan y todas crecen, entre +5,6 % (Lincoln
  Square East) y +17,1 % (Times Sq/Theatre District). Midtown Center lidera con 163.866 viajes
  (+16,9 %). JFK Airport es la única del top 10 que cae (−2,6 %), y LaGuardia, fuera del top, también
  baja (−1,4 %): el crecimiento de 2025 es de viajes urbanos, no de aeropuertos. La demanda además se
  reparte más: el top 10 concentra el 37,7 % de los pickups, frente al 39,7 % de 2024, y Brooklyn casi
  triplica los suyos (22.286 → 60.244), aunque sobre una base chica.

q2: >-
  La hora con mayor ingreso promedio por viaje es las 5 AM en los dos años: US$ 33,64 en 2025 y
  US$ 37,54 en 2024. Es una hora de poco volumen (21.233 viajes, contra 242.182 a las 18, la hora pico
  de demanda en ambos años). Gana porque a esa hora pesan los viajes largos al aeropuerto. En 2025
  esos viajes son menos (del 25,8 % al 20,8 % de los viajes de las 5 AM) y la distancia media baja
  (de 6,23 a 5,71 millas), por eso el ingreso por viaje cae un 10,4 %. Ojo con el segundo puesto de
  2025 (las 12, US$ 30,68): es artificial, porque lo infla un único viaje con una tarifa de
  US$ 863.372. Sin las tarifas mayores a US$ 500, las 12 valen US$ 25,59.

q3: >-
  El 65,98 % de los viajes de enero 2025 pagó cbd_congestion_fee (2.192.727 de 3.323.437, siempre
  US$ 0,75). El porcentaje está diluido porque el peaje empezó el 5 de enero: del 1 al 4 (el 10,4 % de
  los viajes del mes) casi nadie lo pagó (0,12 %; esos unos 400 cobros anticipados quedan marcados
  por la regla R10), y desde el 5 lo paga el 73,6 %. Las 5 zonas con mayor proporción (Stuy
  Town/Peter Cooper Village, Alphabet City, Union Sq, Midtown East y Midtown Center, alrededor del
  90 %) están todas en Manhattan, dentro de la zona de peaje. Contando solo desde el 5 de enero llegan
  al 97–99 %: prácticamente todo viaje que sale de ahí paga. En enero 2024 la columna no existía y
  quedó en NULL (no en 0), así que este indicador no tiene contra qué compararse.

q4: >-
  Con tarjeta de crédito la propina se mantiene estable: 26,29 % de la tarifa en 2025 frente a 26,26 %
  en 2024 (22,9 % y 22,6 % ponderada), y deja propina el 94–95 % de esos viajes. En efectivo da 0 %
  porque la TLC no registra las propinas en efectivo, no porque no se dejen. El cambio grande es Flex
  Fare (payment_type 0), que pasa de alrededor del 4 % a alrededor del 15 % de los viajes
  (115.127 → 412.946 con tarifa > 0) y cuya propina cae del 9,14 % al 2,74 %. Esos viajes llegan sin
  passenger_count, y por eso los warnings de la regla R05 suben del 5,8 % al 16,3 % de las filas
  leídas. "No charge" y "Dispute" tienen una propina cercana a 0, como es esperable.

q5: >-
  Los viajes que empiezan o terminan en JFK o LaGuardia bajan un 1,8 % (276.027 → 270.966) mientras
  el total de la ciudad sube un 15,8 %, así que su peso cae del 9,6 % al 8,2 % de los viajes. La tarifa
  promedio sube de US$ 55,04 a US$ 58,03 (+5,4 %), pero esa suba no es real: la produce un solo viaje
  con fare_amount = US$ 863.372,12 (de LaGuardia a Astoria Park, 1,6 millas, pago en disputa).
  Excluyendo las tarifas mayores a US$ 500 en los dos años, el promedio pasa de US$ 55,01 a
  US$ 54,82 (−0,3 %), y la mediana baja de US$ 53,53 a US$ 52,70. La tarifa fija de JFK (RatecodeID 2) sigue en US$ 70. Ninguna regla
  de calidad pone un tope a la tarifa; ese hueco queda documentado como limitación.

q6: |-
  Enero 2025 tuvo 3.323.437 viajes válidos contra 2.870.896 en enero 2024: +452.541 viajes (+15,76 %). La recaudación total (total_amount) crece un 12,7 %, de US$ 78,4 M a US$ 88,3 M.
  Parte del salto es de calendario: enero 2025 tuvo 5 jueves y 5 viernes (días fuertes), y enero 2024, 5 lunes y 5 martes. Con el calendario de 2024 el crecimiento sería +14,7 %. Todos los días de la semana crecen entre +11 % y +21 %, así que el aumento es real.
  La tarifa promedio baja un 4,00 % (de US$ 18,47 a US$ 17,73); sin las tarifas mayores a US$ 500 (entre ellas, el viaje de US$ 863 mil) la baja es del 5,4 % (de US$ 18,46 a US$ 17,47). La mediana no cambia (US$ 12,80): no bajaron las tarifas, cambió la mezcla de viajes.
  Esa mezcla tiene más viajes Flex Fare, que son más baratos (US$ 14,84 contra US$ 18,22 del resto) y pasan del 4 % al 15 % de los viajes, y menos viajes a aeropuertos (del 9,6 % al 8,2 %) y de más de 10 millas (del 7,9 % al 6,9 %). Sin Flex Fare, la tarifa media casi no cambia (de US$ 18,41 a US$ 18,22).
  Calidad: la cuarentena sube del 3,16 % al 4,37 % de las filas leídas, empujada por las distancias fuera de rango (R03: del 2,0 % al 2,6 %) y por los totales negativos (R04: del 1,2 % al 1,8 %). En los dos meses se cumple la reconciliación: leídas = aceptadas + cuarentena.

conclusiones: |-
  La demanda de taxis amarillos crece con fuerza en enero 2025 (+15,8 % de viajes, +12,7 % de recaudación). El crecimiento se concentra en el núcleo de Manhattan (Midtown, Upper East Side, Union Sq), mientras los aeropuertos se estancan o bajan.
  El peaje de congestión (CBD, US$ 0,75 desde el 5 de enero) alcanza a 3 de cada 4 viajes desde que rige. Varias de las zonas que más crecen están dentro de la zona de peaje (Union Sq +24,1 %, Times Sq +17,1 %, Midtown Center +16,9 %): en este mes no se observa una caída de demanda donde se cobra. Es una correlación, no una medición de causa.
  El viaje promedio es algo más corto (3,16 contra 3,29 millas) y más barato. La baja no viene de las tarifas: la mediana sigue en US$ 12,80, y sin Flex Fare la tarifa por tramo de distancia es casi igual. Viene de la mezcla, con más Flex Fare (tarifa fija acordada por app) y menos aeropuertos y viajes largos. La propina con tarjeta, en cambio, no se mueve (alrededor del 26 %).
  Los promedios son frágiles. Un único viaje con una tarifa de US$ 863.372 cambia el signo de la tarifa media de aeropuertos y el segundo puesto de las horas, por eso se reportan también la mediana y el promedio sin atípicos. La siguiente regla de calidad a agregar es un tope de tarifa o de tarifa por milla.
  Los datos de 2025 traen cambios de formato que el pipeline absorbe sin romperse: la columna nueva cbd_congestion_fee (NULL en 2024) y el aumento de Flex Fare sin passenger_count (warning R05). Las cifras salen de los marts de dbt en Snowflake, son reproducibles con make all MES=2025-01 y los dos meses reconcilian.
