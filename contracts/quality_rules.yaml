# Quality rules (Part 3). Versioned, not hard-coded: src/calidad.py builds one SQL pass from this file.
#
# predicate: DuckDB SQL that is TRUE when the row VIOLATES the rule. A NULL predicate counts as
#            "not violated", so predicates handle NULLs explicitly when NULL must be a violation.
# severity:  reject  -> the row goes to quarantine with every reject rule it violated.
#            warning -> the row is kept and the rule id is added to the quality_flags column.
# Helper columns built before the rules run: duration_sec, pu_zone_exists, do_zone_exists,
# dup_rank (1 = first copy of an exact duplicate group).
# Placeholders: {year}, {month} (month being processed) and every key under `parameters`.
#
# Counts below come from `make explore` on the raw TLC files (Jan 2024 / Jan 2025).
version: 1
parameters:
  # p99 = 20.0 mi and p99.9 = 29.5 mi in 2024-01 (19.5 / 28.9 in 2025-01). Max observed: 312,722 mi.
  # 100 mi covers negotiated out-of-city trips (RatecodeID 4/5) and leaves 59 / 162 rows above it.
  max_trip_distance_miles: 100
  # NYC speed limits are 25 mph in the city and up to 50-55 mph on highways, so an average above
  # 80 mph over a whole trip cannot happen.
  max_avg_speed_mph: 80
  # MTA Congestion Relief Zone toll starts Jan 5, 2025 (TLC data dictionary).
  cbd_fee_start: "2025-01-05 00:00:00"
rules:
  - id: R01
    name: pickup_outside_file_month
    severity: reject
    description: Pickup timestamp is missing or outside the month of the source file.
    threshold: "pickup year/month <> processed year/month"
    rationale: >-
      Rows of another month would land in another partition and break partition replacement:
      reprocessing a month must only touch that month. 2024-01 even has a pickup in 2002.
    predicate: "tpep_pickup_datetime IS NULL OR year(tpep_pickup_datetime) <> {year} OR month(tpep_pickup_datetime) <> {month}"

  - id: R02
    name: dropoff_not_after_pickup
    severity: reject
    description: Dropoff timestamp is missing, before or equal to the pickup timestamp.
    threshold: "duration <= 0 seconds"
    rationale: A trip with non-positive duration is physically impossible and breaks duration and speed.
    predicate: "tpep_dropoff_datetime IS NULL OR tpep_dropoff_datetime <= tpep_pickup_datetime"

  - id: R03
    name: distance_out_of_range
    severity: reject
    description: Trip distance is missing, zero or negative, or above the fixed maximum.
    threshold: "trip_distance <= 0 or > {max_trip_distance_miles} miles"
    rationale: >-
      Distance is the base of speed and fare per mile. Zero/negative distance is a meter or GPS
      failure. Above 100 miles is far beyond p99.9 (about 29 miles).
    predicate: "trip_distance IS NULL OR trip_distance <= 0 OR trip_distance > {max_trip_distance_miles}"

  - id: R04
    name: negative_total_amount
    severity: reject
    description: Total amount is missing or negative.
    threshold: "total_amount < 0"
    rationale: >-
      Negative totals are reversals (mostly dispute, no charge and cash), not trips. Keeping them
      would subtract revenue twice.
    predicate: "total_amount IS NULL OR total_amount < 0"

  - id: R05
    name: passenger_count_missing_or_zero
    severity: warning
    description: Passenger count is NULL or 0.
    threshold: "passenger_count IS NULL or = 0"
    rationale: >-
      NULL is structural on Flex Fare trips (payment_type 0): 4.7% of 2024-01 vs 15.5% of 2025-01.
      Rejecting would bias the year-over-year comparison and no business question uses passengers.
    predicate: "passenger_count IS NULL OR passenger_count = 0"

  - id: R06
    name: unknown_zone
    severity: reject
    description: Pickup or dropoff zone does not exist in the taxi zone lookup.
    threshold: "location id not in taxi_zone_lookup"
    rationale: Without a valid zone the trip cannot join dim_zone, and zone-based questions would lose it silently.
    predicate: "NOT pu_zone_exists OR NOT do_zone_exists"

  - id: R07
    name: exact_duplicate
    severity: reject
    description: Exact duplicate of another row of the same file (every contract column equal).
    threshold: "second and later copies"
    rationale: The first copy is kept as accepted and the extra copies go to quarantine, so trips are not double counted.
    predicate: "dup_rank > 1"

  - id: R08
    name: tip_out_of_range
    severity: warning
    description: Tip is negative or greater than the fare.
    threshold: "tip_amount < 0 or tip_amount > fare_amount"
    rationale: >-
      Unusual but possible (generous tips on short fares, adjustments). The money was charged, so the
      row is kept and flagged; tip percentage analyses can exclude it.
    predicate: "tip_amount < 0 OR tip_amount > fare_amount"

  - id: R09
    name: implausible_average_speed
    severity: reject
    description: Average speed over the whole trip is above the fixed maximum (own rule, found exploring the data).
    threshold: "trip_distance / duration > {max_avg_speed_mph} mph"
    rationale: >-
      Found while exploring: trips of a few seconds with several miles (1,107 rows in 2024-01, 982 in
      2025-01). Either the timestamps or the distance are wrong, so duration, speed and fare per
      mile cannot be trusted.
    predicate: "duration_sec > 0 AND trip_distance / (duration_sec / 3600.0) > {max_avg_speed_mph}"

  - id: R10
    name: cbd_fee_anomaly
    severity: warning
    description: CBD congestion fee is negative, or charged before the toll existed.
    threshold: "cbd_congestion_fee < 0, or > 0 with pickup before {cbd_fee_start}"
    rationale: >-
      Found while exploring 2025-01: 6,553 rows with -0.75 (reversals) and 401 rows charged before
      Jan 5. Kept because a trip that starts before midnight can enter the zone after the toll starts.
    predicate: "cbd_congestion_fee < 0 OR (cbd_congestion_fee > 0 AND tpep_pickup_datetime < TIMESTAMP '{cbd_fee_start}')"
