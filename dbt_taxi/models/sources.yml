version: 2

sources:
  - name: raw
    description: Loaded by src/load_snowflake.py from the DuckDB quality gate (accepted rows only).
    database: "{{ target.database }}"
    schema: raw
    tables:
      - name: yellow_trips
        description: >
          Accepted yellow taxi trips (contract columns plus lineage). Each (year, month) is replaced as a
          whole by the loader.
        columns:
          - name: year
            data_tests: [not_null]
          - name: month
            data_tests: [not_null]
          - name: source_file
            data_tests: [not_null]
      - name: taxi_zones
        description: TLC taxi zone lookup (265 zones, including 264 Unknown and 265 Outside of NYC).
        columns:
          - name: location_id
            data_tests: [unique, not_null]
      - name: yellow_quarantine
        description: >
          Quarantine (exam Part 3): one row per rejected trip, with the original values (contract
          columns), source_file + source_row_number (the untouched raw row) and violated_rules (the
          reject rule ids, ';'-separated). Each (year, month) is replaced as a whole by the loader.
        columns:
          - name: violated_rules
            data_tests: [not_null]
          - name: source_file
            data_tests: [not_null]
          - name: source_row_number
            data_tests: [not_null]
      - name: quality_summary
        description: >
          Quality gate of each month, as reported by the run that loaded it (control database): rows in the
          file, read, accepted, quarantined and accepted with warnings. Each (year, month) is replaced as a whole.
      - name: quality_rules
        description: >
          Rows violating each quality rule in each month (rejects and warnings), with the Spanish description of
          contracts/quality_rules.yaml.
      - name: schema_findings
        description: >
          What each file brought compared with contracts/yellow_schema.yaml, one row per finding. A file that
          matches the contract has a single row with finding = 'none'.
      - name: load_log
        description: One row per load (rows deleted, rows loaded, file SHA-256). Used in the oral defense.
