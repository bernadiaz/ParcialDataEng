version: 2

models:
  - name: stg_yellow_trips
    description: Accepted trips with readable names (pickup_datetime, dropoff_datetime). One row per accepted trip.
    columns:
      - name: pickup_datetime
        data_tests: [not_null]
      - name: pu_location_id
        data_tests: [not_null]
      - name: do_location_id
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
  - name: stg_taxi_zones
    description: One row per TLC LocationID.
    columns:
      - name: location_id
        data_tests: [unique, not_null]
