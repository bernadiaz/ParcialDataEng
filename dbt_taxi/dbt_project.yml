name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Thresholds of the evidence models. tests/test_evidencia.py checks that they are the ones Python uses
# (FARE_CAP and STABLE_PCT of src/interpretacion.py, cbd_fee_start of contracts/quality_rules.yaml).
vars:
  fare_cap: 500               # averages "without outliers" leave out the fares above it (USD)
  long_trip_miles: 10         # a long trip has more miles than this
  stable_pct: 0.5             # a change smaller than this (in %) is "stays the same"
  cbd_fee_start: "2025-01-05" # first day of the MTA Congestion Relief Zone toll
  cbd_min_zone_trips: 1000    # question 3 only ranks the zones with this many trips or more

# FinOps (plan section 3):
# - staging = views, intermediate = ephemeral: no storage and no rebuild cost.
# - fact_trips and agg_zone_hour are incremental by (year, month). make passes the months being
#   processed in DBT_MONTHS. A pre-hook deletes those months, and the run appends them again.
# - dims are small tables, rebuilt each run.
# - Snowflake: STAGING is a TRANSIENT schema (snowflake/setup.sql), so dbt's temporary tables
#   have no Fail-safe. Marts stay permanent (Time Travel).
# - Every query carries query_tag project/env/owner (profiles.yml) for cost attribution.
# - No clustering keys: about 6.4M rows do not need them (avoid premature clustering).
models:
  nyc_taxi:
    staging:
      +schema: staging
      +materialized: view
      +meta: {dagster: {group: staging}}       # asset group in the Dagster lineage
    intermediate:
      +schema: staging
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table
      +transient: false
      +meta: {dagster: {group: marts}}
    # Evidence of the Spanish reports (results/) and of the Superset evidence dashboards: small tables on the
    # monthly aggregates, rebuilt on every run for every month loaded. TRANSIENT on Snowflake (rebuildable).
    evidence:
      +schema: marts
      +materialized: table
      +transient: true
      +meta: {dagster: {group: evidence}}

data_tests:
  nyc_taxi:
    +severity: error
