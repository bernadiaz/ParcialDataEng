global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Batch steps push their metrics to the Pushgateway; honor_labels keeps job/step/mes from the push.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
