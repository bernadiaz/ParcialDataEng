[project]
name = "nyc-taxi-pipeline"
version = "0.1.0"
description = "Pipeline batch NYC Yellow Taxi — Airbyte/S3 + DuckDB + Snowflake/dbt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pyyaml>=6.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "dbt-snowflake>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
