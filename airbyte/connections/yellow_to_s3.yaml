# Plantilla de conexión Airbyte (sin secretos).
# Recrear en la UI / API usando estos valores lógicos.
name: yellow_tlc_to_s3
source:
  type: file_http  # o custom connector HTTP
  streams:
    - name: yellow_tripdata
      url_template: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{{ year }}-{{ month }}.parquet"
      format: parquet
    - name: taxi_zone_lookup
      url: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"
      format: csv
destination:
  type: s3
  bucket: "${S3_BUCKET}"
  region: "${S3_REGION}"
  path_patterns:
    yellow_tripdata: "raw/yellow/year={{ year }}/month={{ month }}/"
    taxi_zone_lookup: "raw/zones/"
  format: preserve_source  # no alterar el Parquet fuente
sync:
  mode: overwrite_by_path
  retries: 3
  backoff_seconds: [1, 2, 4]
idempotency:
  strategy: object_exists_and_sha256_matches
control:
  ingestion_log: "control/ingestion_log.csv"
